근 보고\n\n[심승근 사원] 26-09-01(화) \n\n«상담일정 보고»\n\n신규 : 1\n\n1. 일정 조율 및 콜미팅 예정\n\n2. 알렉산더헤어겔러리 콜미팅 신규(전남광주 서구) -&gt; 계약완료\n\n계약 : 1\n수임료 : 1\n백백 : 0\n\n«해야할 일 보고»\n\n1. 월마감 회의 준비 -&gt; 준비중</div></div><div style=\"padding:11px 13px;border-left:0.5px solid #e6e9ef\"><div style=\"font-size:10px;font-weight:700;color:#0891b2;margin-bottom:7px;text-transform:uppercase\">&#127909; 통화기록</div><video controls preload=\"metadata\" src=\"https://krbizinfo1.monday.com/protected_static/19795044/resources/87816926/file_4103.mp4\" style=\"width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;border:0.5px solid #e6e9ef;background:#000;display:block\"></video></div></div><div style=\"padding:11px 13px\"><div style=\"font-size:10px;font-weight:700;color:#e2445c;margin-bottom:8px;text-transform:uppercase\">상담 자가피드백 &amp; 상담일지</div><div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;margin-bottom:10px;align-items:start\"><div style=\"min-width:0;overflow:hidden\"><div style=\"display:flex;flex-direction:column;gap:0\"><div style=\"border:0.5px solid #e6e9ef;border-radius:8px;overflow:hidden\"><div style=\"background:#fafbfc;padding:6px 10px;border-bottom:0.5px solid #e6e9ef;font-size:10px;font-weight:700;color:#323338\">&#127970; 알렉산더헤어겔러리</div><div style=\"padding:8px 10px;font-size:13px;color:#323338;line-height:1.8;white-space:pre-wrap;word-break:break-word\">※ 상담 후 자가 피드백 \n\n업체명 : 알렉산더헤어겔러리\n성함 : 최정훈\n전화번호 : 26511004\n가능한도 피치 : 2~3천\n수수료 :  7%\n\n1. 상담 목표를 달성 했는지?\n매출액 초과 차입금 및 , 업력 20년 이상이라\n잘 받으면 2~3천만원 정도이며 추가 증액 안되는 건 안된다 얘기했음.\n\n2. 상담 내용에 대한 문제점 및 좋았던 점\n대표자 2~3천만원이라도 필요하니, 희망하여 계약 진행\n2~3천만원도 쉽게 받을 수 있지 않다 언급했음.\n\n3. 차후 해당 고객과의 만남에 참고해야할 점\n2004년 7월 개업\n정책자금 하나도 사용 안함.\n매출액 초과 차입금이지만, 받아볼만함.\n\n계약한  이유 3가지\n1. 대표자, 도움 요청하여 계약 진행\n2. 5천만원은 절대 안된다 얘기했고, 2~3천만원이 마지노선이다 언급했음. 고민해보라고도 했음.\n3. 대표자 필요성이 높아 진행된 건.</div><div style=\"padding:6px 10px;border-top:0.5px solid #e6e9ef;background:#fafbfc\"><div class=\"ap-wrap\" data-aid=\"aud_심승_fb1 max-width:100%;border-radius:8px;border:0.5px solid #e6e9ef;display:block;cursor:pointer;margin-bottom:4px;object-fit:cover\" onclick=\"openLb(this.src)\" loading=\"lazy\" onerror=\"this.style.display='none'\"></div></div></div><div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:0.5px solid #e6e9ef\"><div style=\"padding:11px 13px;border-right:0.5px solid #e6e9ef\"><div style=\"font-size:10px;font-weight:700;color:#0073ea;margin-bottom:7px;text-transform:uppercase\">상담일정 보고</div><div style=\"font-size:13px;color:#323338;line-height:1.75;white-space:pre-wrap;word-break:break-word\">#일간 보고\n\n[심승근 사원] 26-09-03(목) \n\n«상담일정 보고»\n\n1. 일정 조율 및 콜미팅 예정\n\n«해야할 일 보고»\n\n1. 만나 대표자 소통 \n\n2. 다다헌 결제 소통</div></div><div style=\"padding:11px 13px;border-right:0.5px solid #e6e9ef\"><div style=\"font-size:10px;font-weight:700;color:#00c875;margin-bottom:7px;text-transform:uppercase\">퇴근 보고</div><div style=\"font-size:13px;color:#323338;line-height:1.75;white-space:pre-wrap;word-break:break-word\">#퇴근 보고\n\n[심승근 사원] 26-09-03(목) \n\n«상담일정 보고»\n\n신규 : 3\n\n1. 일정 조율 및 콜미팅 예정\n\n2. (주)케이펄스 콜미팅 신규(서울 구로구) -&gt; 계약서 설명 마친 뒤, 서명하고 회신 바로준다고 하고, 연락거절\n\n3. 한빛지게차 콜미팅 신규(경기 평택) -&gt; 명일, 재상담 예정\n\n4. 명품하우징 콜미팅 신규(경기 하남) -&gt; 9월 중순까지 자금 필요, 안 나옴. 중순 넘어가면 5억 생김.\n\n계약 : 0 \n수임료 : 0\n백백 : 0\n\n«해야할 일 보고»\n\n1. 만나 대표자 소통 -&gt; 부재\n\n2. 다다헌 결제 소통 -&gt; 소통완료</div></div><div style=\"padding:11px 13px;border-left:0.5px solid #e6e9ef\"><div style=\"font-size:10px;font-weight:700;color:#0891b2;margin-bottom:7px;text-transform:uppercase\">&#127909; 통화기록</div><video controls preload=\"metadata\" src=\"https://krbizinfo1.monday.com/protected_static/19795044/resources/88206419/file_4195.mp4\" style=\"width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;border:0.5px solid #e6e9ef;background:#000;display:block\"></video></div></div><div style=\"padding:11px 13px\"><div style=\"font-size:10px;font-weight:700;color:#e2445c;margin-bottom:8px;text-transform:uppercase\">상담 자가피드백 &
