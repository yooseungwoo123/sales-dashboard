gba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center" onclick="this.style.display='none'"><img id="lbi" style="max-width:95vw;max-height:95vh;border-radius:8px;object-fit:contain"></div><script>var cardsData={"2026-10-01": "", "2026-10-02": "", "2026-10-05": "", "2026-10-06": "", "2026-10-07": "", "2026-10-08": "", "2026-10-09": "", "2026-10-12": "", "2026-10-13": "", "2026-10-14": "", "2026-10-15": "", "2026-10-16": "", "2026-10-19": "", "2026-10-20": "", "2026-10-21": "", "2026-10-22": "", "2026-10-23": "", "2026-10-26": "", "2026-10-27": "", "2026-10-28": "", "2026-10-29": "", "2026-10-30": ""};function selectDay(el,dateStr){document.querySelectorAll(".dtab").forEach(function(t){t.classList.remove("dtab-active");});el.classList.add("dtab-active");var wrap=document.getElementById("cards-wrap");wrap.innerHTML=cardsData[dateStr]||"<div style=text-align:center;padding:40px;color:#aaa;font-size:13px>데이터 없음</div>";initAudios();}function apToggle(aid){var a=document.getElementById(aid);var btn=document.getElementById(aid+"_btn");if(a.paused){a.play();btn.innerHTML="&#9646;&#9646;"}else{a.pause();btn.innerHTML="&#9654;"}}function apSeek(aid,sec){var a=document.getElementById(aid);a.currentTime=Math.max(0,Math.min(a.duration||0,a.currentTime+sec));}function apClick(aid,e,bar){var a=document.getElementById(aid);var rect=bar.getBoundingClientRect();a.currentTime=(a.duration||0)*((e.clientX-rect.left)/rect.width);}function fmtTime(s){if(isNaN(s))return"0:00";var m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+(sec<10?"0":"")+sec;}function initAudios(){document.querySelectorAll("audio").forEach(function(a){var aid=a.id;a.addEventListener("timeupdate",function(){var bar=document.getElementById(aid+"_bar");var time=document.getElementById(aid+"_time");if(bar&&a.duration)bar.style.width=(a.currentTime/a.duration*100)+"%";if(time)time.textContent=fmtTime(a.currentTime)+" / "+fmtTime(a.duration);});a.addEventListener("ended",function(){var btn=document.getElementById(aid+"_btn");if(btn)btn.innerHTML="&#9654;";});a.addEventListener("loadedmetadata",function(){var time=document.getElementById(aid+"_time");if(time)time.textContent="0:00 / "+fmtTime(a.duration);});});}var activeAid=null;document.addEventListener("click",function(e){var w=e.target.closest(".ap-wrap");if(w)activeAid=w.dataset.aid;});document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("lb").style.display="none";if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&activeAid){e.preventDefault();apSeek(activeAid,e.key==="ArrowRight"?10:-10);}});function openLb(src){var lb=document.getElementById("lb");document.getElementById("lbi").src=src;lb.style.display="flex";}window.addEventListener("load",initAudios);</script></div></body></html>
